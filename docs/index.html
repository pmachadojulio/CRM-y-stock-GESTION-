<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repuestos | Taller Chapa y Pintura</title>
<meta name="description" content="Repuestos de todo tipo + taller de chapa y pintura. Consultá por WhatsApp con tu asesor.">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="Repuestos | Taller Chapa y Pintura">
<meta property="og:description" content="Repuestos de todo tipo + colocación y pintura en taller. Pedí por WhatsApp.">
<meta name="twitter:card" content="summary">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --line:#dde4ee;
  --txt:#182230; --mut:#5d6c82; --acc:#9a3412; --acc-soft:#fff3ea;
  --ok:#15803d; --ok-soft:#e9f7ef; --warn:#92400e; --warn-soft:#fef4e2;
  --bad:#b91c1c; --bad-soft:#fdecec; --wa:#16a34a;
  --r:12px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:40px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--s4)}
header{background:var(--surface);border-bottom:1px solid var(--line);
  padding:var(--s4) 0;position:sticky;top:0;z-index:10}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:.01em}
.brand h1 span{color:var(--acc)}
.brand p{color:var(--mut);font-size:.9rem;margin-top:2px;max-width:62ch}
.asesor{display:inline-flex;align-items:center;gap:var(--s2);margin-top:var(--s3);
  background:var(--acc-soft);border:1px solid #f2c9ab;color:#7c2d12;
  font-size:.8rem;padding:6px var(--s3);border-radius:999px}
.asesor b{color:var(--acc);text-transform:capitalize}
.toolbar{display:grid;grid-template-columns:1fr;gap:var(--s3);margin:var(--s4) auto;max-width:1120px;padding:0 var(--s4)}
@media(min-width:760px){.toolbar{grid-template-columns:2fr 1fr 1fr auto;align-items:end}}
.field{display:flex;flex-direction:column;gap:var(--s1)}
.field label{font-size:.75rem;font-weight:600;color:var(--mut)}
input[type="search"],select{background:var(--surface);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px var(--s3);font-size:.95rem;width:100%}
.check{display:flex;align-items:center;gap:var(--s2);font-size:.85rem;color:var(--mut);padding-bottom:10px}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.count{color:var(--mut);font-size:.85rem;max-width:1120px;margin:0 auto var(--s3);padding:0 var(--s4)}
.grid{display:grid;grid-template-columns:1fr;gap:var(--s4);max-width:1120px;margin:0 auto;padding:0 var(--s4) var(--s6)}
@media(min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(24,34,48,.08)}
.thumb{background:var(--surface-2);min-height:120px;display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;border-bottom:1px solid var(--line)}
.card-body{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);flex:1}
.eyebrow{font-size:.7rem;font-weight:700;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.card h2{font-size:1rem;font-weight:700;line-height:1.35}
.compat{font-size:.82rem;color:var(--mut)}
.desc{font-size:.85rem;color:#33415a}
.price{font-size:1.3rem;font-weight:800;margin-top:var(--s1)}
.avail{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;width:fit-content}
.avail.ok{background:var(--ok-soft);color:var(--ok)}
.avail.low{background:var(--warn-soft);color:var(--warn)}
.avail.out{background:var(--bad-soft);color:var(--bad)}
.btn{display:block;text-align:center;background:var(--wa);color:#fff;font-weight:700;
  text-decoration:none;padding:var(--s3);border-radius:10px;margin-top:auto}
.btn:hover{filter:brightness(1.06)}
.btn[aria-disabled="true"]{background:var(--surface-2);color:var(--mut);pointer-events:none}
.empty{color:var(--mut);grid-column:1/-1;text-align:center;padding:var(--s6) 0}
footer{border-top:1px solid var(--line);background:var(--surface);padding:var(--s5) var(--s4);
  color:var(--mut);font-size:.82rem;text-align:center}
footer nav{display:flex;gap:var(--s4);justify-content:center;flex-wrap:wrap;margin-bottom:var(--s2)}
footer a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>TALLER <span>CHAPA &amp; PINTURA</span> · REPUESTOS</h1>
      <p>Repuestos de todo tipo + colocación y pintura en taller. Precios en ARS, sujetos a stock.</p>
      <p class="asesor" role="status">Tu asesor: <b id="asesor-nombre">local</b> · Cupones: JULIO10 / MATIAS10</p>
    </div>
  </div>
</header>

<main>
  <div class="toolbar wrap" role="search" aria-label="Buscar repuestos">
    <div class="field">
      <label for="q">Buscar</label>
      <input id="q" type="search" placeholder="Ej.: paragolpe Gol, pastillas, batería…" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-tipo">Rubro</label>
      <select id="f-tipo"><option value="">Todos</option></select>
    </div>
    <div class="field">
      <label for="f-marca">Marca</label>
      <select id="f-marca"><option value="">Todas</option></select>
    </div>
    <label class="check"><input type="checkbox" id="f-stock" checked> Solo con stock</label>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <noscript><p class="wrap" style="color:var(--warn)">Esta página necesita JavaScript para mostrar el catálogo.</p></noscript>
</main>

<footer>
  <nav aria-label="Contacto">
    <a href="https://wa.me/5493534018769">WhatsApp Julio</a>
    <a href="https://wa.me/5493534128663">WhatsApp Matías</a>
    <a href="data/stock.csv">Ver stock</a>
  </nav>
  <p>Instalación en taller disponible · Hecho con GitHub Pages</p>
</footer>

<script>
"use strict";
const CONFIG = {
  numeros: { julio: "5493534018769", matias: "5493534128663" },
  porDefecto: "julio",
  moneda: (n) => "$" + Number(n || 0).toLocaleString("es-AR", { maximumFractionDigits: 0 })
};
const VENDEDORES = Object.keys(CONFIG.numeros);
const ASESOR_EL = document.getElementById("asesor-nombre");

// Atribución first-touch: ?v=julio|matias → se recuerda en el navegador
(function initAsesor() {
  const p = (new URLSearchParams(location.search).get("v") || "").toLowerCase().trim();
  if (p) localStorage.setItem("crm_vendedor", VENDEDORES.includes(p) ? p : "local");
  ASESOR_EL.textContent = localStorage.getItem("crm_vendedor") || "local";
})();
const vendedor = () => localStorage.getItem("crm_vendedor") || "local";
const numeroPara = (v) => CONFIG.numeros[v] || CONFIG.numeros[CONFIG.porDefecto];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const head = lines[0].split(",");
  return lines.slice(1).filter((l) => l.trim()).map((l) => {
    const cols = l.split(",");
    const o = {};
    head.forEach((k, i) => { o[k.trim()] = (cols[i] || "").trim(); });
    o.precio_venta = Number(o.precio_venta || 0);
    o.stock = Number(o.stock || 0);
    o.stock_minimo = Number(o.stock_minimo || 1);
    return o;
  });
}

let ITEMS = [];
async function load() {
  try {
    const res = await fetch("data/stock.csv", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    ITEMS = parseCSV(await res.text()).filter((x) => x.sku && x.publicado === "si");
  } catch {
    document.getElementById("grid").innerHTML =
      '<p class="empty">No se pudo cargar el stock. Revisá tu conexión e intentá de nuevo.</p>';
    return;
  }
  const tipos = [...new Set(ITEMS.map((i) => i.tipo).filter(Boolean))].sort();
  const marcas = [...new Set(ITEMS.map((i) => i.marca).filter(Boolean))].sort();
  const ft = document.getElementById("f-tipo"), fm = document.getElementById("f-marca");
  for (const t of tipos) ft.add(new Option(t, t));
  for (const m of marcas) fm.add(new Option(m, m));
  render();
}

function disponibilidad(i) {
  if (i.stock <= 0) return '<p class="avail out">Sin stock — consultanos reposición</p>';
  if (i.stock <= i.stock_minimo) return `<p class="avail low">¡Últimas ${i.stock} unidades!</p>`;
  return `<p class="avail ok">En stock (${i.stock})</p>`;
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const t = document.getElementById("f-tipo").value;
  const m = document.getElementById("f-marca").value;
  const soloStock = document.getElementById("f-stock").checked;
  const v = vendedor();
  const list = ITEMS.filter((i) => {
    if (soloStock && i.stock <= 0) return false;
    if (t && i.tipo !== t) return false;
    if (m && i.marca !== m) return false;
    if (q && !`${i.nombre} ${i.sku} ${i.auto_compatible} ${i.marca}`.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent =
    `${list.length} producto${list.length === 1 ? "" : "s"}` + (v !== "local" ? ` · tu asesor: ${v}` : "");
  const grid = document.getElementById("grid");
  if (!list.length) {
    grid.innerHTML = '<p class="empty">Sin resultados. Probá otra búsqueda o desactivá “Solo con stock”.</p>';
    return;
  }
  grid.innerHTML = list.map((i) => {
    const msg = encodeURIComponent(
      `Hola, vengo de la web (vendedor: ${v}). Me interesa ${i.sku} - ${i.nombre} (${CONFIG.moneda(i.precio_venta)}). ¿Sigue disponible?`);
    const wa = `https://wa.me/${numeroPara(v)}?text=${msg}`;
    const sinStock = i.stock <= 0;
    return `<article class="card">
      <div class="thumb" aria-hidden="true">🔧</div>
      <div class="card-body">
        <p class="eyebrow">${esc(i.sku)} · ${esc(i.tipo)} · ${esc(i.marca)}</p>
        <h2>${esc(i.nombre)}</h2>
        <p class="compat">Compatible: ${esc(i.auto_compatible) || "—"}</p>
        ${i.texto_auto ? `<p class="desc">${esc(i.texto_auto)}</p>` : ""}
        <p class="price">${CONFIG.moneda(i.precio_venta)}</p>
        ${disponibilidad(i)}
        <a class="btn" href="${wa}" target="_blank" rel="noopener"${sinStock ? ' aria-disabled="true"' : ""}>Consultar por WhatsApp</a>
      </div>
    </article>`;
  }).join("");
}

for (const id of ["q", "f-tipo", "f-marca", "f-stock"]) {
  document.getElementById(id).addEventListener("input", render);
}
load();
</script>
</body>
</html>
